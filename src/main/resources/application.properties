spring.application.name=egovernance-grievance-system
server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/egovernance_workflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enable scheduled tasks for 72-hr SLA Escalation Engine
spring.task.scheduling.pool.size=2

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
